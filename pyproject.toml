[project]
name = "ferc-elibrary-mcp"
version = "0.2.0"
description = "MCP server and Python library for searching and downloading public FERC eLibrary filings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zoschin", email = "zachoschin@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "ferc",
    "elibrary",
    "energy",
    "regulatory",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
]

[project.urls]
Homepage = "https://github.com/OWNER/ferc-elibrary-mcp"
Repository = "https://github.com/OWNER/ferc-elibrary-mcp"
Issues = "https://github.com/OWNER/ferc-elibrary-mcp/issues"

[project.scripts]
ferc-elibrary-mcp = "ferc_elibrary_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the public FERC eLibrary API (deselected by default)",
]
addopts = ["-m", "not live"]
