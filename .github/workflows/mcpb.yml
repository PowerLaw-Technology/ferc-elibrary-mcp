name: MCPB

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MCPB CLI
        run: npm install --global @anthropic-ai/mcpb

      - name: Validate manifest
        run: mcpb validate manifest.json

      - name: Pack bundle
        run: mkdir -p dist && mcpb pack . dist/ferc-elibrary.mcpb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferc-elibrary.mcpb
          path: dist/ferc-elibrary.mcpb

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ferc-elibrary.mcpb
